// Numerical core: a JavaScript port of report_code.ipynb (ChaosEmbeddings).
// Runs both on the main thread (cheap figures) and inside Web Workers (heavy figures).

/* ---------------- random numbers ---------------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;

    do { u = r() * 2 - 1; v = r() * 2 - 1; s = u * u + v * v; } while (s >= 1 || s === 0);
    const m = Math.sqrt(-2 * Math.log(s) / s); spare = v * m; return u * m;
  };

/* ---------------- Lorenz 63 ---------------- */
function lorenzFn(p) {
  const S = p.sigma, R = p.rho, B = p.beta;
  return function (t, x, out) {
    out[0] = S * (x[1] - x[0]);

    out[2] = x[0] * x[1] - B * x[2];

        if (rejected) factor = Math.min(1, factor);

      } else {

      }
    }

    for (let i = 0; i < n; i++) for (let c = 0; c < 4; c++) { let s = 0; for (let j = 0; j < 7; j++) s += K[j][i] * P[j][c]; Q[i][c] = s; }

      const x2 = x * x, x3 = x2 * x, x4 = x3 * x;
      for (let i = 0; i < n; i++) out[i][ei] = y[i] + h * (Q[i][0] * x + Q[i][1] * x2 + Q[i][2] * x3 + Q[i][3] * x4);

/* ---------------- KD-tree (any dimension) ---------------- */

/* ---------------- data handling ---------------- */

}

  if (E) { a0._limits(); a1.set({ xlim: a0.xl }); }
  else { a0.set({ xlim: [-1475, 41975], ylim: [-0.0125, 0.0425] }); a1.set({ xlim: [-1475, 41975], ylim: [-0.8, 2.85] }); }
  $('figa1').innerHTML = fig.toSVG();
}

/* ================= Figure 5: metric entropy vs noise ================= */
function runFig5() {
  progress('fig5', 0.01);
  runJob('fig5', Object.assign({}, G, { k: ST.fig5.k }), (m) => { RES.fig5 = m.data; progress('fig5', m.data.frac); drawFig5(); });
}
function drawFig5() {
  const fig = new Fig(1635, 588);
  const axs = [[164, 83, 610, 450], [662, 83, 1108, 450], [1160, 83, 1606, 450]].map(b => fig.addAxes(...b));
  const R = RES.fig5, colors = [Purples(0.9), Purples(0.7), Purples(0.5)];
  axs[0].set({ ylabel: 'Metric Entropy' });
  axs[2].plot([0], [0], { color: Purples(0.8), label: 'Metric Entropy', noscale: true });
  if (R) {
    if (R.fits) R.fits.forEach(([m, c], i) => axs[i].plot(R.nf, R.nf.map(a => R.dt * Math.exp(m * a + c)), { color: 'black', alpha: 0.5, ls: '--', label: 'Exponential Fit' }));
    axs.forEach((ax, i) => ax.plot(R.nf, R.h.map(h => R.dt * h[i]), { color: colors[i] }));
  }
  axs.forEach((ax, i) => ax.set({ xlabel: 'Noise Fraction', title: `Dimension ${LABELS[i]}`, yticklabels: i === 0 }));
  axs[2].legend({ frameon: false, loc: 'upper right' });
  // sharey
  let lo = Infinity, hi = -Infinity; axs.forEach(a => { a._limits(); lo = Math.min(lo, a.yl[0]); hi = Math.max(hi, a.yl[1]); });
  if (!R) { lo = -0.0015; hi = 0.0325; }
  axs.forEach(a => a.set({ ylim: [lo, hi], xlim: [-0.05, 1.05] }));
  $('fig5').innerHTML = fig.toSVG();
}

/* ================= Figure 6: sensitivity + Lyapunov spectrum ================= */
let F6 = null;
function computeFig6left() {
  const N = 2000;
  const sol = integrateLorenz(G, X0, 0, 20, N, N);
  const rnd = makeNormal(1000 + ST.fig6.seed);
  const pert = [0, 1, 2].map(() => rnd() * 1e-3);
  const pr = integrateLorenz(G, X0.map((v, i) => v + pert[i]), 0, 20, N, N);
  F6 = { sol, pr };
}
function runLyap() { progress('fig6', 0.01); runJob('lyap', Object.assign({}, G), (m) => { RES.lyap = m.data; progress('fig6', 1); drawFig6(); }); }
function drawFig6() {
  const fig = new Fig(1789, 881);
  const L = [[156, 86, 893, 269], [156, 323, 893, 506], [156, 560, 893, 743]].map(b => fig.addAxes(...b));
  const { sol, pr } = F6, cols = [Purples(0.9), Purples(0.7), Purples(0.5)];
  L.forEach((ax, i) => {
    ax.plot(sol.t, sol.y[i], { color: 'grey', label: LABELS[i], ls: '--' });
    ax.plot(pr.t, pr.y[i], { color: cols[i], label: 'Perturbed ' + LABELS[i] });
    ax.axvspan(0, 8, { color: 'grey', alpha: 0.2 });
    ax.set({ xlim: [0, 20], ylabel: LABELS[i], xticklabels: i === 2 });
  });
  L[0].legend({ frameon: false, loc: 'upper center', fontsize: 8, bbox: [0.5, 1.4], ncol: 2 });
  L[2].set({ xlabel: 'Time' });
  const ax4 = fig.addAxes(1023, 86, 1760, 743);
  ax4.set({ title: 'Lyapunov Spectrum', xlabel: 'Time' });
  const R = RES.lyap;
  if (R) {
    const n = R.over[0].length, time = linspace(0, n * 0.01, n);
    for (let i = 0; i < 3; i++) ax4.plot(time, R.over[i], { color: CYCLE[i], label: `$\\lambda_${i + 1}$ = ${R.exps[i].toFixed(3)}` });
    ax4._limits(); ax4.set({ ylim: [ax4.yl[0], 7] });
  } else ax4.set({ xlim: [-0.5, 10.5], ylim: [-16.2, 7] });
  ax4.legend({ frameon: false, loc: 'upper right', fontsize: 8, labelspacing: 0.2 });
  $('fig6').innerHTML = fig.toSVG();
}

/* ================= Figure 7: optimal embedding parameters ================= */
function runFig7() {
  progress('fig7', 0.01);
  runJob('fig7', Object.assign({}, G, { a: ST.fig7.a }), (m) => {
    RES.fig7 = m.data; progress('fig7', m.data.frac); drawFig7();
    if (m.type === 'done' && !ST.fig8.touched) {
      const t = m.data.smi.ind, tn = m.data.smiN.ind;
      if (t !== ST.fig8.tau || tn !== ST.fig8.tauN) { ST.fig8.tau = t; ST.fig8.tauN = tn; CTL.tau && CTL.tau.refresh(); runFig8(); }
    }
  });
}
function drawFig7() {
  const fig = new Fig(1638, 1180);
  const box = [[122, 82, 780, 452], [952, 82, 1610, 452], [122, 664, 780, 1034], [952, 664, 1610, 1034]];
  const axs = box.map(b => fig.addAxes(...b));
  const R = RES.fig7 || {};
  const aStr = (v) => String(+v.toFixed(4));
  const titles = ['a=0', 'a=0', 'a=' + aStr(ST.fig7.a), 'a=' + aStr(ST.fig7.a)];
  const smiPanel = (ax, S) => {
    if (S) {
      ax.plot(range(0, S.smi.length), S.smi, { color: CYCLE[0] });
      if (S.ind >= 0) {
        ax.axvline(S.ind, { color: 'black', ls: '--', label: `Optimal Delay $\\tau^* = ${S.ind}$` });
        ax.plot([S.ind], [S.smi[S.ind]], { ls: 'none', marker: 'o', color: 'black' });
      }
    }
    ax.set({ xlabel: 'Embedding Delay $\\tau$', ylabel: 'Self Mutual Information' });
    if (!S || S.smi.length < 100) ax.set({ xlim: [-4.95, 103.95] });
    if (!S) ax.set({ ylim: [-0.4, 8.35] });
    ax.legend({ frameon: false, loc: 'upper right' });
  };
  const caoPanel = (ax, C) => {
    if (C) {
      ax.plot(range(0, C.E1.length), C.E1, { color: CYCLE[0], label: 'Ratio E1' });
      ax.plot(range(0, C.E2.length), C.E2, { color: Purples(0.5), label: 'Ratio E2' });
      ax.hlines(1, 0, C.E1.length, { color: 'black', ls: '--', lw: 0.8, label: '$E_\\text{i} = 1$' });
    } else ax.set({ xlim: [-0.45, 9.45], ylim: [-0.06, 1.25] });
    ax.set({ xlabel: 'Embedding Dimension $\\tilde{m}$', ylabel: 'E1 & E2' });
    ax.legend({ frameon: false, loc: 'lower right' });
  };
  smiPanel(axs[0], R.smi); caoPanel(axs[1], R.cao); smiPanel(axs[2], R.smiN); caoPanel(axs[3], R.caoN);
  axs.forEach((a, i) => a.set({ title: titles[i] }));
  $('fig7').innerHTML = fig.toSVG();
}

/* ================= Figure 8: entropy of the embedding ================= */
function runFig8() {
  progress('fig8', 0.01);
  const S = ST.fig8;
  runJob('fig8', Object.assign({}, G, { tau: S.tau, tauN: S.tauN, m: S.m, k: S.k, a: ST.fig7.a }), (m) => { RES.fig8 = m.data; RES.fig8.m = S.m; progress('fig8', m.data.frac); drawFig8(); });
}
function drawFig8() {
  const R = RES.fig8 || {}, m = R.m || ST.fig8.m;
  const top = 83, bot = 1638, gap = 50, hh = (bot - top - gap * (m - 1)) / m;
  const fig = new Fig(1782, 1779);
  const rows = range(0, m).map(i => [top + i * (hh + gap), top + i * (hh + gap) + hh]);
  const axs = rows.map(([y0, y1]) => [fig.addAxes(163, y0, 934, y1), fig.addAxes(983, y0, 1753, y1)]);
  const aStr = String(+ST.fig7.a.toFixed(4));
  const dt = R.dt || 0.01;
  const panel = (ax, D, d, col, lab, dummy) => {
    if (dummy) ax.plot([0], [0], { label: 'a=0', alpha: 0.8, color: Purples(0.9), noscale: true });
    if (D) {
      ax.plot(D.x, D.y.map(r => Math.exp(r[d])), { label: lab, alpha: 0.8, color: col });
      const xi = D.x.slice(0, 50).filter((_, i) => D.masks[d][i]);
      ax.plot(xi, xi.map(v => Math.exp(D.slopes[d] * v + D.intercepts[d])), { color: 'black', alpha: 0.8, lw: 2, ls: '--', label: 'Linear Fit' });
      ax.text(0.05, 0.9, `$h_{${d}}$ = ${sval(dt * D.slopes[d] / 2, 2)}`, { size: 10, ha: 'left', va: 'top', transform: 'axes' });
    }
  };
  for (let d = 0; d < m; d++) {
    panel(axs[d][0], R.clean, d, Purples(0.9), 'a=0', false);
    panel(axs[d][1], R.noisy, d, Purples(0.5), 'a=' + aStr, true);
    axs[d][0].set({ ylabel: `1-r (Dimension ${d})`, ylog: true, xticklabels: d === m - 1 });
    axs[d][1].set({ ylog: true, xticklabels: d === m - 1, yticklabels: false });
  }
  axs[0][0].set({ title: 'a=0 (No Noise)' }); axs[0][1].set({ title: ` a=${aStr} (Noise)` });
  axs[m - 1].forEach(a => a.set({ xlabel: '$t_\\text{fc}$' }));
  axs[m - 1][1].legend({ loc: 'lower right', frameon: false });
  // sharex / sharey
  const flat = axs.flat(); let ylo = Infinity, yhi = -Infinity, xlo = Infinity, xhi = -Infinity;
  flat.forEach(a => { a._limits(); ylo = Math.min(ylo, a.yl[0]); yhi = Math.max(yhi, a.yl[1]); xlo = Math.min(xlo, a.xl[0]); xhi = Math.max(xhi, a.xl[1]); });
  if (!R.clean) { ylo = 2.5e-3; yhi = 0.6; xlo = -0.04; xhi = 1.05; }
  flat.forEach(a => a.set({ ylim: [ylo, yhi], xlim: [xlo, xhi] }));
  $('fig8').innerHTML = fig.toSVG();
}

/* ================= wiring ================= */
const CTL = {};
function recomputeAllHeavy() { runFig4(); runEns(); runFig5(); runLyap(); runFig7(); runFig8(); }
function onGlobalInput() {
  computeFig1(); drawFig1();
  computeFig2base(); drawFig2();
  computeFig3base(); drawFig3();
  computeFig6left(); drawFig6();
}
function buildControls() {
  const c1 = $('fig1-c');
  const heavy = () => later('heavy', recomputeAllHeavy, 300);
  const g = (k) => () => G[k], s = (k) => (v) => { G[k] = v; };
  slider(c1, 'σ', 1, 20, 0.1, g('sigma'), s('sigma'), () => later('g', onGlobalInput, 30), heavy, 1);
  slider(c1, 'ρ', 10, 50, 0.1, g('rho'), s('rho'), () => later('g', onGlobalInput, 30), heavy, 1);
  slider(c1, 'β', 0.5, 5, 0.01, g('beta'), s('beta'), () => later('g', onGlobalInput, 30), heavy, 2);

  const c2 = $('fig2-c');
  slider(c2, 'k', 1, 30, 1, () => ST.fig2.k, v => ST.fig2.k = v, () => requestAnimationFrame(drawFig2), null, 0);
  slider(c2, 't<sub>fc</sub>', 0.02, 1.5, 0.02, () => ST.fig2.tfc, v => { ST.fig2.tfc = v; ST.fig2.t = Math.min(ST.fig2.t, 12 - v - 0.02); }, () => requestAnimationFrame(drawFig2), null, 2);

  const c3 = $('fig3-c');
  slider(c3, 'k', 1, 100, 1, () => ST.fig3.k, v => ST.fig3.k = v, () => later('f3', drawFig3, 10), null, 0);
  slider(c3, 't<sub>fc</sub>', 0.01, 0.5, 0.01, () => ST.fig3.fc * 0.01, v => ST.fig3.fc = Math.round(v / 0.01), () => later('f3', drawFig3, 10), null, 2);

  slider($('fig4-c'), 'k', 10, 1000, 10, () => ST.fig4.k, v => ST.fig4.k = v, null, () => later('f4', runFig4), 0);
  slider($('fig5-c'), 'k', 10, 500, 10, () => ST.fig5.k, v => ST.fig5.k = v, null, () => later('f5', runFig5), 0);

  slider($('fig7-c'), 'a', 0, 0.5, 0.01, () => ST.fig7.a, v => ST.fig7.a = v, () => { drawFig7(); drawFig8(); }, () => later('f7', () => { runFig7(); runFig8(); }), 2);

  const c8 = $('fig8-c');
  CTL.tau = slider(c8, 'τ', 1, 60, 1, () => ST.fig8.tau, v => { ST.fig8.tau = v; ST.fig8.touched = true; }, null, () => later('f8', runFig8), 0);
  slider(c8, 'm̃', 1, 8, 1, () => ST.fig8.m, v => ST.fig8.m = v, null, () => later('f8', runFig8), 0);
}
async function main() {
  try {
    await Promise.race([Promise.all([
      document.fonts.load("16px 'Source Sans 3'"), document.fonts.load("italic 16px 'Source Sans 3'"), document.fonts.load("bold 16px 'Source Sans 3'")]),
      new Promise(r => setTimeout(r, 2500))]);
  } catch (e) { /* offline: fall back */ }
  buildControls();
  onGlobalInput();
  drawFig4(); drawFig5(); drawFig7(); drawFig8(); drawFigA1();
  hookRotate(); hookFig2Drag();
  $('fig6').addEventListener('click', (e) => {
    const rc = $('fig6').getBoundingClientRect(); if ((e.clientX - rc.left) / rc.width > 0.53) return;
    ST.fig6.seed++; computeFig6left(); drawFig6();
  });
  recomputeAllHeavy();
}
main();
